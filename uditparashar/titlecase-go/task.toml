schema_version = "1.4"

# What the agent must hand over. The verifier runs in its own container, so the agent's
# finished repository is exported as an artifact and re-materialised there at the same path.
artifacts = ["/workspace/repo"]

[task]
name = "trainee/titlecase-go"
version = "1.0.0"
description = "Port the python-titlecase library to Go with byte-exact output, then remove all Python files."
authors = [{ name = "Trainee" }]
keywords = ["go", "python", "porting", "unicode", "regex"]

[metadata]
author_name = "Trainee"
category = "programming"
tags = ["porting", "go", "python", "text-processing"]
source_repo = "https://github.com/ppannuto/python-titlecase"
source_commit = "42f43e2de55bf003b286c6f8e8d8b2d26676a167"
source_license = "MIT"

[agent]
timeout_sec = 3600.0          # how long the agent may work
network_mode = "allowlist"    # no internet; Harbor adds the model endpoint automatically
allowed_hosts = []

[verifier]
timeout_sec = 900.0           # how long the tests may run
environment_mode = "separate" # tests run in their own container; the agent never sees tests/
network_mode = "allowlist"    # needed only so uvx can download Reward Kit
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
collect = []

[verifier.env]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
