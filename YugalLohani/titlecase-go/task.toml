schema_version = "1.4"

# Harbor copies these paths from the agent's container into the verifier at
# the same absolute paths.  The verifier's grader.py inspects /workspace/repo.
artifacts = ["/workspace/repo"]

[task]
name = "default/titlecase-go"
version = "1.0.0"
description = "Port the python-titlecase library to Go, matching its output byte-for-byte."
authors = []
keywords = ["go", "titlecase", "text-processing", "port"]

[metadata]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
# The verifier needs outbound network access so uvx can download harbor-rewardkit.
network_mode = "public"
collect = []

[verifier.env]

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
