schema_version = "1.4"
artifacts = []

[task]
name = "my-org/figlet-go"
version = "1.0.0"
description = "Port pyfiglet (FIGlet in Python) to Go with byte-for-byte identical output."
keywords = ["porting", "go", "python", "figlet", "ascii-art"]
[[task.authors]]
name = "Shashwat Suman"

[metadata]
category = "programming"
tags = ["porting", "go", "figlet", "text-rendering"]
source_repo = "https://github.com/pwaller/pyfiglet"
source_commit = "255827efbc09d662875dad50fa0edc1e1263bf45"
source_license = "MIT"

[agent]
# Non-root user created in environment/Dockerfile (D4).
user = "player"
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
# Shared verifier: /tests is copied into the room only after the agent has
# finished, so the agent never sees it. `harbor lint` warns `shared-verifier`
# about this; that is expected for this practice task.
collect = []

[verifier.env]

[environment]
# Public network for this practice task (see the task guide). The Dockerfile
# sets GOPROXY=off, so Go cannot download third-party modules anyway.
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
mcp_servers = []

[environment.env]

[solution.env]
