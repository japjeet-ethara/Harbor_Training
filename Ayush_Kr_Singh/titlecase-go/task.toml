schema_version = "1.4"
artifacts = ["/tmp/repo.tar.gz"]

[task]
name = "my-org/titlecase-go"
version = "1.0.0"
description = "Port ppannuto/python-titlecase to standard-library Go matching original behavior byte for byte."
keywords = ["go", "python", "porting", "titlecase", "text-processing"]

[[task.authors]]
name = "Ayush Singh"

[metadata]
author_name = "Ayush Singh"
category = "programming"
tags = ["porting", "go", "python"]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "public"

[[verifier.collect]]
command = "rm -f /tmp/repo.tar.gz /tmp/repo.tar.gz.tmp && tar -C /workspace -czf /tmp/repo.tar.gz.tmp repo && mv /tmp/repo.tar.gz.tmp /tmp/repo.tar.gz"
timeout_sec = 60.0

[verifier.env]

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
mcp_servers = []

[environment.env]

