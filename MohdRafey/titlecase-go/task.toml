schema_version = "1.4"

# The verifier runs in its own container and only receives what is listed here.
artifacts = ["/workspace/repo"]

[task]
name = "harbor-practice/titlecase-go-port"
version = "1.0.0"
description = "Port the python-titlecase library to a Go command-line program."
authors = []
keywords = ["go", "python", "port"]

