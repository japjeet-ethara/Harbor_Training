  "files.pythonhosted.org",
  "pypi.python.org",
  "github.com",
  "*.githubusercontent.com",
  "astral.sh",
  "*.astral.sh",
]

[verifier.env]

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
os = "linux"
mcp_servers = []

