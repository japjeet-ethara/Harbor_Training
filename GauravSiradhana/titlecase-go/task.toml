schema_version = "1.4"
artifacts = ["/workspace/repo"]

[task]
name = "ethara/titlecase-go"
version = "1.0.0"
description = "Port the Python titlecase library to Go with byte-for-byte output."
keywords = ["porting", "go", "python", "regex"]

[[task.authors]]
name = "Gaurav Siradhana"

[metadata]
author_name = "Gaurav Siradhana"
