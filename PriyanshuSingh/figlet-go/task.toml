schema_version = "1.4"
artifacts = ["/workspace/repo"]

[task]
name = "priyanshu/figlet-go"
version = "1.0.0"
description = "Port pyfiglet's FIGlet renderer to Go, byte for byte, with the Python removed."
authors = []
keywords = ["go", "porting", "ascii-art", "figlet"]

[metadata]
category = "programming"
source_repo = "https://github.com/pwaller/pyfiglet"
source_sha = "255827efbc09d662875dad50fa0edc1e1263bf45"
licence = "MIT"

[verifier]
timeout_sec = 900.0
# The verifier shares the agent's container (default "shared" mode). It must
# run as root: the image's USER is player, and the grader has to lock /tests
# away from the agent's program, which it runs as "nobody".
user = "root"
collect = []

[verifier.env]

[agent]
user = "player"
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096
mcp_servers = []

[environment.env]

[solution.env]
