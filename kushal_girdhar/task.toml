schema_version = "1.4"
source = "https://github.com/ppannuto/python-titlecase/tree/42f43e2de55bf003b286c6f8e8d8b2d26676a167"
artifacts = ["/workspace/repo"]

[task]
name = "kushal-girdhar/titlecase-go"
description = "Port the pinned Python titlecase function to a Go stdin/stdout program."
authors = [{ name = "Kushal Girdhar", email = "kushal.girdhar@ethara.ai" }]
keywords = ["go", "unicode", "porting"]

[agent]
timeout_sec = 1800.0
user = "candidate"
network_mode = "no-network"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
network_mode = "no-network"

[verifier]
timeout_sec = 360.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
network_mode = "no-network"
