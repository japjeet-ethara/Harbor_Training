schema_version = "1.4"
artifacts = ["/workspace/repo"]

[task]
name = "aman/titlecase-go"
version = "1.0.0"
description = "Port python-titlecase to Go"
authors = [{ name = "Aman" }]
keywords = ["go", "python", "titlecase"]

[metadata]
category = "programming"
tags = ["go", "porting"]

[agent]
timeout_sec = 600.0
network_mode = "no-network"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "public"
collect = []

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []
