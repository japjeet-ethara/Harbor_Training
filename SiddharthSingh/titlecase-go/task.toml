version = "1.0"

[task]
name = "titlecase-go"

[metadata]
author_name = "Harbor Trainee"
category = "programming"
tags = ["go", "port", "string-processing"]

[agent]
timeout_sec = 1800.0
network_mode = "none"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

