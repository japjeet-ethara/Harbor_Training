schema_version = "1.4"
artifacts = ["/workspace/repo"]

[task]
name = "training/titlecase-go"
version = "1.0.0"

[[task.authors]]
name = "Titlecase task contributors"

[metadata]
category = "programming"
tags = ["go", "python", "porting", "titlecase", "rewardkit"]

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier]
environment_mode = "separate"
timeout_sec = 360.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
