schema_version = "1.4"

# The verifier runs in its own container, so the Go sources the agent wrote
# are copied there from the agent container at the same path.
artifacts = ["/workspace/repo"]

[task]
name = "satyam/titlecase-go"
version = "1.0.0"
description = "Port the python-titlecase library (regex look-ahead/look-behind rules) to Go, byte-for-byte compatible."
keywords = ["go", "python", "port", "regex", "string-processing"]

[[task.authors]]
name = "Satyam Pandey"

[metadata]
author_name = "Satyam Pandey"
category = "programming"
difficulty = "hard"
tags = ["go", "python", "porting", "regex", "text-processing", "byte-exact"]
source_repo = "https://github.com/ppannuto/python-titlecase"
source_commit = "42f43e2de55bf003b286c6f8e8d8b2d26676a167"
source_license = "MIT"

[agent]
timeout_sec = 1800.0
# Harbor adds the model endpoint to the allowlist automatically.
network_mode = "allowlist"
allowed_hosts = []

[verifier]
timeout_sec = 300.0
environment_mode = "separate"
# Reward Kit is pre-installed in tests/Dockerfile, so grading needs no network.
network_mode = "no-network"
collect = []

[verifier.env]

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
