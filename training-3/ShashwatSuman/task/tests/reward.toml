# Combine the three checks into the main reward with a weighted mean.
# To prevent unearned marks (empty stubs or delete-only tricks),
# the free checks (build and no_python) have minimal weights,
# ensuring any cheat scoring 0 on behaviour stays strictly below 0.2.
#
#   empty stub (build + no_python only) -> (0.05 + 0.05) / (0.05 + 0.05 + 4.0) ~= 0.024 (< 0.2)
#   perfect solution                    -> 1.0
[[reward]]
name = "reward"
aggregation = "weighted-mean"
weights = { build = 0.05, no_python = 0.05, behaviour = 4.0 }
