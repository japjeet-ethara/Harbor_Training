schema_version = "1.4"

# The agent's repository is copied out of its container after it finishes and
# into the separate verifier container at the same path.
artifacts = ["/workspace/repo"]

[task]
name = "my-org/titlecase-go"
version = "1.0.0"
description = "Port python-titlecase to Go with byte-for-byte identical output."
keywords = ["porting", "go", "python", "regex", "text-processing"]
[[task.authors]]
name = "Shashwat Suman"

[metadata]
category = "programming"
tags = ["porting", "go", "python", "regex"]
source_repo = "https://github.com/ppannuto/python-titlecase"
source_commit = "42f43e2de55bf003b286c6f8e8d8b2d26676a167"
source_license = "MIT"

[agent]
timeout_sec = 3600.0
# Non-root user created in environment/Dockerfile.
user = "agent"
# No internet for the agent. Harbor adds the model endpoint automatically.
network_mode = "allowlist"
allowed_hosts = []

[verifier]
timeout_sec = 600.0
# Tests run in their own container (built from tests/Dockerfile), so the agent
# can never see tests/ or the hidden answer sheet.
environment_mode = "separate"
# Reward Kit is pre-installed in tests/Dockerfile, so grading needs no network.
network_mode = "no-network"
collect = []

[verifier.env]

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
mcp_servers = []

[environment.env]

[solution.env]
