version = "1.0"

[task]
name = "japjeet-ethara/titlecase-go"

[metadata]
author_name = "Japjeet"
category = "programming"
tags = ["go", "python", "porting", "regex", "titlecase"]

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = []          # Harbor adds the model endpoint automatically

[verifier]
timeout_sec = 600.0
environment_mode = "shared"   # tests run in their own container, agent cannot see tests/
network_mode = "no-network"     # grading is fully local, no judge API needed

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
