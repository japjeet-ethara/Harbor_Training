schema_version = "1.4"
artifacts = ["/workspace/repo"]

[task]
name = "saket/titlecase-go"
version = "1.0.0"
description = "Port the python-titlecase library to Go so that its output matches the Python original byte for byte."
keywords = ["porting", "go", "python", "regex", "titlecase"]
[[task.authors]]
name = "Saket Kukatkar"

[metadata]
category = "programming"
tags = ["porting", "go", "regex", "edge-cases"]
source_repo = "https://github.com/ppannuto/python-titlecase"
source_commit = "42f43e2de55bf003b286c6f8e8d8b2d26676a167"
source_licence = "MIT"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
collect = []

