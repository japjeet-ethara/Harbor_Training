schema_version = "1.3"
artifacts = ["/workspace/repo"]

[task]
name = "aahan-trikha/titlecase-go"
version = "1.0.0"
description = "Port python-titlecase to Go with exact line-oriented behavior."
keywords = ["go", "titlecase", "rewardkit", "python-port"]

[metadata]
difficulty = "hard"
